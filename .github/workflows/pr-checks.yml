# PR checks: on every pull request into main, build the app image and test it:
# unit tests inside the image against PostgreSQL, then E2E in a real browser against the running image.
# The job name `pr-tests` is the required status check in the main ruleset: rename both together.
# Nothing is pushed anywhere. After the merge, release.yml builds and pushes the image.
# The base image comes from the repository variable BASE_IMAGE (Settings → Secrets and variables → Actions → Variables),
# e.g. docker.io/andrewromanchukk/zapik-base:<tag>@sha256:<digest>.
name: pr-checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      db:
        # Same pinned image as docker-compose.yml
        image: postgres:16.16-alpine3.24@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        env:
          POSTGRES_DB: zapik
          POSTGRES_USER: zapik
          POSTGRES_PASSWORD: zapik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zapik -d zapik"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check BASE_IMAGE variable
        env:
          BASE_IMAGE: ${{ vars.BASE_IMAGE }}
        run: |
          if [ -z "$BASE_IMAGE" ]; then
            echo "::error::Repository variable BASE_IMAGE is not set"
            exit 1
          fi
          echo "Base image: $BASE_IMAGE"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Docker layers are cached in the GitHub Actions cache: unchanged layers (e.g. pip install) are reused.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: BASE_IMAGE=${{ vars.BASE_IMAGE }}
          tags: zapik-web:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=zapik-web
          cache-to: type=gha,scope=zapik-web,mode=max

      - name: Run tests inside the image
        run: |
          mkdir -p test-results && chmod 777 test-results   # the image runs as uid 10001
          docker run --rm --network host \
            -v "$PWD/test-results:/test-results" \
            -e JUNIT_XML=/test-results/unit.xml \
            -e DJANGO_ENV=local \
            -e DJANGO_SECRET_KEY=ci-only-not-secret \
            -e DATABASE_URL=postgres://zapik:zapik@localhost:5432/zapik \
            -e RUN_MIGRATIONS=0 \
            -e SEED_DEMO=0 \
            zapik-web:ci-${{ github.sha }} \
            python manage.py test tests --testrunner tests.junit.DjangoJUnitRunner

      # ---- E2E: release checks 1–2 in a real browser, against the image that was just built ----
      - name: Start app for E2E
        run: |
          docker run -d --name zapik-e2e --network host \
            -e DJANGO_ENV=local \
            -e DJANGO_DEBUG=True \
            -e DJANGO_SECRET_KEY=ci-only-not-secret \
            -e DATABASE_URL=postgres://zapik:zapik@localhost:5432/zapik \
            -e RUN_MIGRATIONS=1 \
            -e SEED_DEMO=1 \
            zapik-web:ci-${{ github.sha }} \
            python manage.py runserver 0.0.0.0:8000 --noreload
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/healthz >/dev/null && exit 0
            sleep 2
          done
          docker logs zapik-e2e
          exit 1

      - name: Cache pip and Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: e2e-${{ runner.os }}-${{ hashFiles('e2e/requirements.txt') }}

      - name: Install Playwright (CI only, not in the image)
        run: |
          python3 -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/pip install --require-hashes --no-deps -r e2e/requirements.txt
          /tmp/e2e-venv/bin/python -m playwright install --with-deps chromium

      - name: E2E tests (browser)
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_ARTIFACTS: test-results/e2e-failures   # screenshots + Playwright traces of failed tests
        run: /tmp/e2e-venv/bin/python -m tests.junit e2e test-results/e2e.xml

      - name: App logs (on failure)
        if: failure()
        run: docker logs zapik-e2e || true

      # ---- test record: JUnit XML always, screenshots + traces when E2E failed ----
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("| Suite | Tests | Failed | Skipped | Time, s |\n|---|---|---|---|---|")
          for path in sorted(glob.glob("test-results/*.xml")):
              s = ET.parse(path).getroot()[0]
              failed = int(s.get("failures")) + int(s.get("errors"))
              print(f"| {s.get('name')} | {s.get('tests')} | {failed} | {s.get('skipped')} | {s.get('time')} |")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-pr-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
