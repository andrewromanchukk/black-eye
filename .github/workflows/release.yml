# Release: after a merge into main, build the app image, run ALL tests against it again — unit tests inside the image
# and E2E in a browser (the merge commit can differ from what the PR tested) — and only then push that exact image
# to ECR as <repo>:<full git sha>. ECR tags are immutable; only this workflow's role may push.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 720459752381.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: dev/zapik
  ECS_CLUSTER: zapik-staging        # existing ECS cluster and service (not created by this workflow)
  ECS_SERVICE: zapik-staging-web

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # OIDC token for AWS

    services:
      db:
        # Same pinned image as docker-compose.yml
        image: postgres:16.16-alpine3.24@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        env:
          POSTGRES_DB: zapik
          POSTGRES_USER: zapik
          POSTGRES_PASSWORD: zapik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zapik -d zapik"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check BASE_IMAGE variable
        env:
          BASE_IMAGE: ${{ vars.BASE_IMAGE }}
        run: |
          if [ -z "$BASE_IMAGE" ]; then
            echo "::error::Repository variable BASE_IMAGE is not set"
            exit 1
          fi
          echo "Base image: $BASE_IMAGE"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Docker layers are cached in the GitHub Actions cache: unchanged layers (e.g. pip install) are reused.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: BASE_IMAGE=${{ vars.BASE_IMAGE }}
          tags: zapik-web:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=zapik-web
          cache-to: type=gha,scope=zapik-web,mode=max

      - name: Run tests inside the image
        run: |
          mkdir -p test-results && chmod 777 test-results   # the image runs as uid 10001
          docker run --rm --network host \
            -v "$PWD/test-results:/test-results" \
            -e JUNIT_XML=/test-results/unit.xml \
            -e DJANGO_ENV=local \
            -e DJANGO_SECRET_KEY=ci-only-not-secret \
            -e DATABASE_URL=postgres://zapik:zapik@localhost:5432/zapik \
            -e RUN_MIGRATIONS=0 \
            -e SEED_DEMO=0 \
            zapik-web:ci-${{ github.sha }} \
            python manage.py test tests --testrunner tests.junit.DjangoJUnitRunner

      # ---- E2E: release checks 1–2 in a real browser, against the image that was just built ----
      - name: Start app for E2E
        run: |
          docker run -d --name zapik-e2e --network host \
            -e DJANGO_ENV=local \
            -e DJANGO_DEBUG=True \
            -e DJANGO_SECRET_KEY=ci-only-not-secret \
            -e DATABASE_URL=postgres://zapik:zapik@localhost:5432/zapik \
            -e RUN_MIGRATIONS=1 \
            -e SEED_DEMO=1 \
            zapik-web:ci-${{ github.sha }} \
            python manage.py runserver 0.0.0.0:8000 --noreload
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/healthz >/dev/null && exit 0
            sleep 2
          done
          docker logs zapik-e2e
          exit 1

      # Playwright Python package from cache. The browser is NOT downloaded: the runner image already has Google Chrome
      # with all its system libraries, so no `playwright install --with-deps` (that apt-installed ~100 packages every run).
      - name: Restore pip cache
        id: e2e-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: e2e-pip-${{ runner.os }}-${{ hashFiles('e2e/requirements.txt') }}

      - name: Install Playwright (CI only, not in the image)
        run: |
          python3 -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/pip install --require-hashes --no-deps -r e2e/requirements.txt
          CHROME="$(command -v google-chrome || true)"
          if [ -n "$CHROME" ]; then
            echo "E2E_CHROME=$CHROME" >> "$GITHUB_ENV"
            "$CHROME" --version
          else  # fallback if the runner image ever drops Chrome
            /tmp/e2e-venv/bin/python -m playwright install --with-deps chromium
          fi

      # Saved even when tests fail (plain actions/cache saves only on success).
      - name: Save pip cache
        if: always() && steps.e2e-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.e2e-cache.outputs.cache-primary-key }}

      - name: E2E tests (browser)
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_ARTIFACTS: test-results/e2e-failures   # screenshots + Playwright traces of failed tests
        run: /tmp/e2e-venv/bin/python -m tests.junit e2e test-results/e2e.xml

      # The same read-only smoke test that will run against ECS after each deploy (when CD exists),
      # here against the image just built: /healthz, public booking page, owner login.
      - name: Smoke test
        env:
          SMOKE_BASE_URL: http://localhost:8000
          E2E_ARTIFACTS: test-results/e2e-failures
        run: /tmp/e2e-venv/bin/python -m tests.junit e2e test-results/smoke.xml 'smoke*.py'

      - name: App logs (on failure)
        if: failure()
        run: docker logs zapik-e2e || true

      # ---- test record: JUnit XML always, screenshots + traces when E2E failed ----
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("| Suite | Tests | Failed | Skipped | Time, s |\n|---|---|---|---|---|")
          for path in sorted(glob.glob("test-results/*.xml")):
              s = ET.parse(path).getroot()[0]
              failed = int(s.get("failures")) + int(s.get("errors"))
              print(f"| {s.get('name')} | {s.get('tests')} | {failed} | {s.get('skipped')} | {s.get('time')} |")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-release-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 90   # longest GitHub allows: the test record of the image pushed to ECR

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push image to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker tag zapik-web:ci-${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"
          echo "Pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"

  # Deploy the image that `release` just tested and pushed: dev/zapik:<git sha> -> task definition -> ECS service.
  deploy:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: deploy-staging        # one deploy at a time; a newer merge waits instead of racing
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # OIDC token for AWS

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Put this commit's image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: deploy/task-definition.json
          container-name: web
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Register task definition and update the ECS service
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Deploy summary
        run: |
          {
            echo "### Deployed to ECS"
            echo "- Image: \`${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}\`"
            echo "- Task definition: \`${{ steps.deploy.outputs.task-definition-arn }}\`"
            echo "- Service: \`${ECS_CLUSTER}/${ECS_SERVICE}\` (stable)"
          } >> "$GITHUB_STEP_SUMMARY"

