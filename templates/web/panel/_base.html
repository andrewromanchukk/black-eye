{% extends "base.html" %}
{% block title %}{% block ptitle %}Panel{% endblock %} — Zapik{% endblock %}
{% block nav %}
<nav class="nav" aria-label="Panel">
  {% with u=request.resolver_match.url_name %}
  <a href="{% url 'web:schedule' %}"{% if u == 'schedule' or u == 'manual_booking' %} aria-current="page"{% endif %}>Grafik</a>
  <a href="{% url 'web:storage' %}"{% if u == 'storage' %} aria-current="page"{% endif %}>Przechowalnia</a>
  <a href="{% url 'web:reminders' %}"{% if u == 'reminders' %} aria-current="page"{% endif %}>Przypomnienia</a>
  <a href="{% url 'web:sms_log' %}"{% if u == 'sms_log' %} aria-current="page"{% endif %}>SMS</a>
  <a href="{% url 'web:services' %}"{% if u == 'services' or u == 'service_edit' %} aria-current="page"{% endif %}>Usługi</a>
  <a href="{% url 'web:bays' %}"{% if u == 'bays' or u == 'bay_edit' %} aria-current="page"{% endif %}>Stanowiska</a>
  <a href="{% url 'web:settings' %}"{% if u == 'settings' %} aria-current="page"{% endif %}>Ustawienia</a>
  {% endwith %}
  <form class="btn-inline-form" method="post" action="{% url 'web:logout' %}">{% csrf_token %}<button class="btn btn--ghost btn--sm" style="margin-top:4px">Wyloguj</button></form>
</nav>
{% endblock %}
